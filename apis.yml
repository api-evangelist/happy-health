aid: happy-health
name: Happy Health
description: >-
  Happy Health, Inc. is an Austin, Texas digital health company behind the Happy Ring — an
  FDA-cleared, clinical-grade smart ring — and Happy Sleep, its at-home sleep-testing and
  sleep-apnea care service. The ring passively measures brain and body biomarkers using four
  LEDs, four electrodes, a three-axis accelerometer and two temperature sensors, capturing
  electrodermal activity, blood oxygen, pulse rate, heart-rate variability, respiratory rate,
  peripheral skin temperature and movement, and streams them over Bluetooth to the Happy Sleep
  app for clinician and researcher review. The company markets the platform to clinical-trial
  sponsors, provider groups and researchers with claims of cloud integration, an available SDK,
  eClinical/EDC and EHR integration, and SMART on FHIR interoperability — but publishes no
  public developer portal, API reference, SDK package or machine-readable specification, so
  none of that integration surface is reachable or evaluable without a sales conversation.
